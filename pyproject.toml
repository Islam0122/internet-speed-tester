[project]
name = "internet-speed-tester"
version = "1.0.0"
description = "Backend-side internet download speed tester built with FastAPI."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends()/Body() pattern relies on call-in-default-arg.

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
